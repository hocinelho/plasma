<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Plasma — Analytics & Memory</title>
    <style>
        /* ── Design tokens (matches index.html) ────────────────── */
        :root {
            --bg: #0a0e1a;
            --panel: #141b2e;
            --text: #e6edf7;
            --muted: #8a94a7;
            --accent: #4a9eff;
            --accent-hot: #ff4a5e;
            --ok: #6fd48a;
            --warn: #f5a623;
            --border: #2a3450;
            --font-base: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, 'Segoe UI', sans-serif;
            font-size: var(--font-base);
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(14px, 3vw, 28px) clamp(12px, 4vw, 24px);
        }

        /* ── Header ─────────────────────────────────────────────── */
        .page-header {
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .back-link {
            color: var(--muted);
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .back-link:hover { color: var(--text); border-color: var(--muted); }

        h1 {
            font-weight: 300;
            letter-spacing: 0.15em;
            font-size: clamp(22px, 5vw, 34px);
        }

        .subtitle {
            color: var(--muted);
            font-size: clamp(11px, 2.5vw, 13px);
            margin-left: auto;
        }

        /* ── Tab nav ─────────────────────────────────────────────── */
        .tabs {
            width: 100%;
            max-width: 900px;
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 10px 18px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
            transition: color 0.15s, border-color 0.15s;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        /* ── Panel container ─────────────────────────────────────── */
        .panel {
            width: 100%;
            max-width: 900px;
            display: none;
            flex-direction: column;
            flex: 1;
        }
        .panel.active { display: flex; }

        /* ── Toolbar (refresh + count) ──────────────────────────── */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }

        .toolbar .count {
            font-size: 12px;
            color: var(--muted);
        }

        .refresh-btn {
            margin-left: auto;
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 8px;
            padding: 5px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .refresh-btn:hover { color: var(--text); border-color: var(--muted); }

        /* ── Facts table (PA-68) ─────────────────────────────────── */
        .facts-wrap {
            background: var(--panel);
            border-radius: 12px;
            overflow: hidden;
            flex: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead th {
            text-align: left;
            padding: 12px 16px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            background: #0e1424;
        }

        tbody tr:hover { background: rgba(74, 158, 255, 0.05); }

        tbody td {
            padding: 10px 16px;
            border-bottom: 1px solid #1a2038;
            vertical-align: top;
            word-break: break-word;
        }
        tbody tr:last-child td { border-bottom: none; }

        .td-category {
            color: var(--accent);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            white-space: nowrap;
        }
        .td-content { max-width: 420px; }
        .td-user { color: var(--muted); font-size: 12px; white-space: nowrap; }
        .td-date { color: var(--muted); font-size: 11px; white-space: nowrap; }

        .delete-btn {
            background: none;
            border: 1px solid #3a2030;
            color: var(--accent-hot);
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .delete-btn:hover { background: rgba(255, 74, 94, 0.12); border-color: var(--accent-hot); }

        .empty-msg {
            color: var(--muted);
            text-align: center;
            padding: 60px 20px;
            font-size: 13px;
        }

        /* ── Skills bar chart (PA-72) ────────────────────────────── */
        .chart-wrap {
            background: var(--panel);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
        }

        #skills-canvas {
            display: block;
            width: 100%;
        }

        /* ── Latency line chart (PA-73) ──────────────────────────── */
        .latency-info {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 12px;
        }
        .latency-info span { color: var(--accent); font-family: monospace; }

        #latency-canvas {
            display: block;
            width: 100%;
            background: var(--panel);
            border-radius: 12px;
            padding: 20px;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 12px;
            font-size: 12px;
            color: var(--muted);
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── Responsive ──────────────────────────────────────────── */
        @media (max-width: 600px) {
            thead th:nth-child(3),
            thead th:nth-child(4),
            tbody td:nth-child(3),
            tbody td:nth-child(4) { display: none; }
        }
    </style>
</head>
<body>

<div class="page-header">
    <a class="back-link" href="/">&#8592; Back to Plasma</a>
    <h1>ANALYTICS</h1>
    <span class="subtitle">memory &amp; performance</span>
</div>

<!-- Tab navigation -->
<nav class="tabs" role="tablist">
    <button class="tab-btn active" role="tab" data-tab="memory" aria-selected="true">Memory</button>
    <button class="tab-btn" role="tab" data-tab="skills" aria-selected="false">Skills</button>
    <button class="tab-btn" role="tab" data-tab="latency" aria-selected="false">Latency</button>
</nav>

<!-- ── PA-68: Memory / fact browser ───────────────────────── -->
<div class="panel active" id="panel-memory">
    <div class="toolbar">
        <span class="count" id="facts-count">— facts</span>
        <button class="refresh-btn" id="facts-refresh">&#8635; Refresh</button>
    </div>
    <div class="facts-wrap">
        <table id="facts-table" aria-label="Stored facts">
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Content</th>
                    <th>User</th>
                    <th>Date</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="facts-body">
                <tr><td colspan="5" class="empty-msg">Loading…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ── PA-72: Skill usage stats ───────────────────────────── -->
<div class="panel" id="panel-skills">
    <div class="toolbar">
        <span class="count" id="skills-count">— skills</span>
        <button class="refresh-btn" id="skills-refresh">&#8635; Refresh</button>
    </div>
    <div class="chart-wrap">
        <canvas id="skills-canvas" height="420"></canvas>
    </div>
</div>

<!-- ── PA-73: Response latency graph ──────────────────────── -->
<div class="panel" id="panel-latency">
    <div class="toolbar">
        <div class="latency-info">Session: <span id="session-id-display">—</span></div>
        <button class="refresh-btn" id="latency-refresh">&#8635; Refresh</button>
    </div>
    <canvas id="latency-canvas" height="300"></canvas>
    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#4a9eff"></div>Total ms</div>
        <div class="legend-item"><div class="legend-dot" style="background:#6fd48a"></div>ASR ms</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f5a623"></div>LLM ms</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff4a5e"></div>TTS ms</div>
    </div>
</div>

<script>
'use strict';

// ── Tab switching ──────────────────────────────────────────────────────────
const tabBtns = document.querySelectorAll('.tab-btn');
const panels  = document.querySelectorAll('.panel');

tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        tabBtns.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
        panels.forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        const id = 'panel-' + btn.dataset.tab;
        document.getElementById(id).classList.add('active');
    });
});

// ── Session ID from localStorage ───────────────────────────────────────────
const SESSION_ID = localStorage.getItem('plasma_session_id') || 'default';
document.getElementById('session-id-display').textContent = SESSION_ID;

// ── Utility ────────────────────────────────────────────────────────────────
function fmtDate(ts) {
    if (!ts) return '—';
    try {
        const d = new Date(ts.replace(' ', 'T') + (ts.includes('T') ? '' : 'Z'));
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: '2-digit' });
    } catch (_) { return ts.slice(0, 10); }
}

function escHtml(s) {
    return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// ── PA-68: Facts ───────────────────────────────────────────────────────────
async function loadFacts() {
    const tbody = document.getElementById('facts-body');
    const countEl = document.getElementById('facts-count');
    tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">Loading…</td></tr>';
    try {
        const res = await fetch('/api/facts?limit=500');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const facts = data.facts || [];
        countEl.textContent = facts.length + ' fact' + (facts.length !== 1 ? 's' : '');
        if (facts.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">No facts stored yet.</td></tr>';
            return;
        }
        tbody.innerHTML = facts.map(f => `
            <tr data-id="${f.id}">
                <td class="td-category">${escHtml(f.category)}</td>
                <td class="td-content">${escHtml(f.content)}</td>
                <td class="td-user">${escHtml(f.user ?? '—')}</td>
                <td class="td-date">${fmtDate(f.created_at)}</td>
                <td><button class="delete-btn" data-id="${f.id}" aria-label="Delete fact">Delete</button></td>
            </tr>
        `).join('');
        tbody.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => deleteFact(Number(btn.dataset.id), btn));
        });
    } catch (e) {
        tbody.innerHTML = `<tr><td colspan="5" class="empty-msg">Error: ${escHtml(e.message)}</td></tr>`;
        countEl.textContent = 'error';
    }
}

async function deleteFact(id, btn) {
    btn.disabled = true;
    btn.textContent = '…';
    try {
        const res = await fetch('/api/facts/' + id, { method: 'DELETE' });
        if (res.ok) {
            const row = btn.closest('tr');
            row.style.opacity = '0';
            row.style.transition = 'opacity 0.25s';
            setTimeout(() => { row.remove(); refreshFactsCount(); }, 250);
        } else {
            btn.disabled = false;
            btn.textContent = 'Delete';
            alert('Delete failed (HTTP ' + res.status + ')');
        }
    } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Delete';
        alert('Delete error: ' + e.message);
    }
}

function refreshFactsCount() {
    const rows = document.querySelectorAll('#facts-body tr[data-id]');
    const n = rows.length;
    document.getElementById('facts-count').textContent = n + ' fact' + (n !== 1 ? 's' : '');
}

document.getElementById('facts-refresh').addEventListener('click', loadFacts);

// ── PA-72: Skills bar chart ────────────────────────────────────────────────
async function loadSkills() {
    const canvas = document.getElementById('skills-canvas');
    const countEl = document.getElementById('skills-count');
    const ctx = canvas.getContext('2d');

    // Clear
    const W = canvas.parentElement.clientWidth - 40; // subtract padding
    const MAX_ROWS = 15;
    const ROW_H = 28;
    const LABEL_W = Math.min(200, Math.floor(W * 0.3));
    const BAR_AREA = W - LABEL_W - 60; // 60 for count badge
    const H = ROW_H * MAX_ROWS + 20;

    canvas.width  = W;
    canvas.height = H;

    ctx.fillStyle = '#141b2e';
    ctx.fillRect(0, 0, W, H);

    try {
        const res = await fetch('/api/skills/stats');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const all = (data.skills || []).sort((a, b) => b.usage_count - a.usage_count);
        const skills = all.slice(0, MAX_ROWS);
        countEl.textContent = all.length + ' skill' + (all.length !== 1 ? 's' : '');

        if (skills.length === 0) {
            ctx.fillStyle = '#8a94a7';
            ctx.font = '13px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('No skill usage recorded yet.', W / 2, H / 2);
            return;
        }

        const maxCount = Math.max(...skills.map(s => s.usage_count), 1);

        skills.forEach((skill, i) => {
            const y = i * ROW_H + 10;
            const barLen = Math.round((skill.usage_count / maxCount) * BAR_AREA);
            const name = skill.name.length > 24 ? skill.name.slice(0, 22) + '…' : skill.name;

            // Label
            ctx.fillStyle = '#8a94a7';
            ctx.font = '12px -apple-system, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillText(name, LABEL_W, y + ROW_H / 2);

            // Bar background
            ctx.fillStyle = '#1a2038';
            ctx.beginPath();
            ctx.roundRect(LABEL_W + 8, y + 4, BAR_AREA, ROW_H - 8, 4);
            ctx.fill();

            // Bar fill
            if (barLen > 0) {
                const grad = ctx.createLinearGradient(LABEL_W + 8, 0, LABEL_W + 8 + barLen, 0);
                grad.addColorStop(0, '#4a9eff');
                grad.addColorStop(1, '#7c6af7');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect(LABEL_W + 8, y + 4, barLen, ROW_H - 8, 4);
                ctx.fill();
            }

            // Count label
            ctx.fillStyle = '#e6edf7';
            ctx.font = '11px -apple-system, sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText(String(skill.usage_count), LABEL_W + 8 + BAR_AREA + 8, y + ROW_H / 2);
        });
    } catch (e) {
        ctx.fillStyle = '#ff4a5e';
        ctx.font = '13px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Error: ' + e.message, W / 2, H / 2);
        countEl.textContent = 'error';
    }
}

document.getElementById('skills-refresh').addEventListener('click', loadSkills);

// ── PA-73: Latency line chart ──────────────────────────────────────────────
async function loadLatency() {
    const canvas = document.getElementById('latency-canvas');
    const ctx = canvas.getContext('2d');

    const W = canvas.parentElement.clientWidth - 40;
    const H = 300;
    const PAD = { top: 20, right: 20, bottom: 40, left: 60 };

    canvas.width  = W;
    canvas.height = H;

    ctx.fillStyle = '#141b2e';
    ctx.fillRect(0, 0, W, H);

    try {
        const res = await fetch('/api/latency/' + encodeURIComponent(SESSION_ID));
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const rows = data.latency || [];

        if (rows.length === 0) {
            ctx.fillStyle = '#8a94a7';
            ctx.font = '13px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('No latency data for this session yet.', W / 2, H / 2);
            return;
        }

        const plotW = W - PAD.left - PAD.right;
        const plotH = H - PAD.top - PAD.bottom;

        // Find y max across all series
        const allVals = rows.flatMap(r => [r.total_ms, r.asr_ms, r.llm_ms, r.tts_ms].filter(v => v != null));
        const yMax = Math.max(...allVals, 1);

        // Grid lines
        const gridLines = 5;
        ctx.strokeStyle = '#1a2038';
        ctx.lineWidth = 1;
        for (let i = 0; i <= gridLines; i++) {
            const y = PAD.top + plotH - (i / gridLines) * plotH;
            ctx.beginPath();
            ctx.moveTo(PAD.left, y);
            ctx.lineTo(PAD.left + plotW, y);
            ctx.stroke();

            // Y axis label
            ctx.fillStyle = '#8a94a7';
            ctx.font = '10px -apple-system, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillText(Math.round((i / gridLines) * yMax) + 'ms', PAD.left - 6, y);
        }

        // X axis turn labels
        ctx.fillStyle = '#8a94a7';
        ctx.font = '10px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        rows.forEach((r, i) => {
            const x = PAD.left + (i / Math.max(rows.length - 1, 1)) * plotW;
            if (i === 0 || i === rows.length - 1 || i % Math.ceil(rows.length / 8) === 0) {
                ctx.fillText('T' + (r.turn + 1), x, H - PAD.bottom + 6);
            }
        });

        // Draw series
        const series = [
            { key: 'total_ms', color: '#4a9eff', width: 2.5 },
            { key: 'asr_ms',   color: '#6fd48a', width: 1.5 },
            { key: 'llm_ms',   color: '#f5a623', width: 1.5 },
            { key: 'tts_ms',   color: '#ff4a5e', width: 1.5 },
        ];

        series.forEach(({ key, color, width }) => {
            const points = rows.map((r, i) => ({
                x: PAD.left + (i / Math.max(rows.length - 1, 1)) * plotW,
                y: PAD.top + plotH - ((r[key] ?? 0) / yMax) * plotH,
            }));

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = width;
            ctx.lineJoin = 'round';
            points.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
            ctx.stroke();

            // Dots
            ctx.fillStyle = color;
            points.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
        });

    } catch (e) {
        ctx.fillStyle = '#ff4a5e';
        ctx.font = '13px -apple-system, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('Error: ' + e.message, W / 2, H / 2);
    }
}

document.getElementById('latency-refresh').addEventListener('click', loadLatency);

// ── Auto-refresh every 30 seconds ──────────────────────────────────────────
function refreshAll() {
    loadFacts();
    loadSkills();
    loadLatency();
}

// Initial load
refreshAll();
setInterval(refreshAll, 30000);
</script>
</body>
</html>
