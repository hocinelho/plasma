<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Plasma — Voice Assistant</title>
    <style>
        /* ── Design tokens ─────────────────────────────────── */
        :root {
            --bg: #0a0e1a;
            --panel: #141b2e;
            --text: #e6edf7;
            --muted: #8a94a7;
            --accent: #4a9eff;
            --accent-hot: #ff4a5e;
            --ok: #6fd48a;
            --warn: #f5a623;
            --border: #2a3450;
            --font-base: 14px;
            --btn-size: clamp(120px, 35vw, 160px);
        }

        /* PA-71: high-contrast accessibility theme */
        html.hc {
            --bg: #000000;
            --panel: #0d0d0d;
            --text: #ffffff;
            --muted: #cccccc;
            --accent: #00aaff;
            --accent-hot: #ff3333;
            --ok: #00ee55;
            --warn: #ffcc00;
            --border: #666666;
            --font-base: 16px;
        }
        html.hc .turn { border-bottom-color: #333; }
        html.hc #talk-btn { border-width: 3px; }
        html.hc #status-bar { border: 1px solid var(--border); }
        html.hc .log-header button,
        html.hc #theme-btn { border-color: var(--border); }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; }

        body {
            font-family: -apple-system, 'Segoe UI', sans-serif;
            font-size: var(--font-base);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 12px;
            position: relative;
            /* deep-space backdrop: nebula glows over near-black */
            background:
                radial-gradient(1200px 700px at 15% -10%, rgba(74,158,255,0.16), transparent 60%),
                radial-gradient(1000px 800px at 110% 10%, rgba(255,74,140,0.12), transparent 55%),
                radial-gradient(900px 900px at 50% 120%, rgba(120,90,255,0.14), transparent 60%),
                #05070f;
        }
        /* full-screen animated field (bokeh + flowing light streams) */
        #bg-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        /* ── PA-69: responsive header ──────────────────────── */
        .header {
            width: 100%;
            max-width: 700px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 4px;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 0.2em;
            font-size: clamp(28px, 8vw, 42px);
        }
        .subtitle {
            color: var(--muted);
            font-size: clamp(11px, 3vw, 14px);
            margin-bottom: 20px;
        }

        /* ── JARVIS neural-galaxy avatar ────────────────────── */
        #avatar-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        #avatar {
            width: 190px;
            height: 190px;
            display: block;
            /* soft outer aura; hue is nudged per-state from JS */
            filter: drop-shadow(0 0 18px rgba(120, 180, 255, 0.25));
            transition: filter 0.5s;
        }

        /* PA-71: theme toggle ──────────────────────────────── */
        #theme-btn {
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            border-radius: 8px;
            padding: 5px 9px;
            font-size: 17px;
            line-height: 1;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }
        #theme-btn:hover,
        html.hc #theme-btn { border-color: var(--text); color: var(--text); }

        /* PA-82: setup wizard link ─────────────────────────── */
        #setup-link {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            text-decoration: none;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 5px 9px;
            font-size: 13px;
            line-height: 1;
            white-space: nowrap;
            transition: border-color 0.2s, color 0.2s;
        }
        #setup-link:hover { border-color: var(--text); color: var(--text); }

        /* ── PA-39 Status indicator ────────────────────────── */
        #status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 20px;
            border-radius: 24px;
            background: var(--panel);
            margin-bottom: 20px;
            font-size: 13px;
            transition: background 0.3s;
            min-width: 170px;
            justify-content: center;
        }
        #status-bar .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--muted);
            flex-shrink: 0;
            transition: background 0.2s;
        }
        #status-bar .label {
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            transition: color 0.2s;
        }
        #status-bar.idle      .dot   { background: var(--ok); }
        #status-bar.idle      .label { color: var(--ok); }
        #status-bar.listening        { background: #1e0e14; }
        #status-bar.listening .dot   { background: var(--accent-hot); animation: pulse 0.9s infinite; }
        #status-bar.listening .label { color: var(--accent-hot); }
        #status-bar.thinking         { background: #0d1628; }
        #status-bar.thinking  .dot   { background: var(--accent); animation: pulse 0.5s infinite; }
        #status-bar.thinking  .label { color: var(--accent); }
        #status-bar.speaking         { background: #0d1e14; }
        #status-bar.speaking  .dot   { background: var(--ok); animation: pulse 0.7s infinite; }
        #status-bar.speaking  .label { color: var(--ok); }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.35; transform: scale(0.85); }
        }

        /* ── PA-69 + PA-70: talk button ────────────────────── */
        #talk-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            border-radius: 50%;
            border: 1.5px solid rgba(120,180,255,0.55);
            background:
                radial-gradient(circle at 38% 32%, rgba(120,180,255,0.30), transparent 55%),
                radial-gradient(circle, rgba(31,43,74,0.65), rgba(10,14,26,0.65));
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: var(--text);
            font-size: clamp(14px, 4vw, 18px);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            touch-action: none;
            margin-bottom: 8px;
            box-shadow: 0 0 28px rgba(74,158,255,0.25), inset 0 0 22px rgba(74,158,255,0.12);
        }
        #talk-btn:hover {
            border-color: var(--accent-hot);
            box-shadow: 0 0 40px rgba(255,74,94,0.35), inset 0 0 22px rgba(255,74,94,0.15);
            transform: scale(1.03);
        }
        #talk-btn.recording {
            background: radial-gradient(circle, #4a1f2b, #2b1421);
            border-color: var(--accent-hot);
            box-shadow: 0 0 40px rgba(255, 74, 94, 0.5);
            transform: scale(1.05);
        }

        /* PA-70: hide SPACE hint on pure-touch devices */
        .hint {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 14px;
        }
        body.touch-mode .hint { display: none; }

        /* ── PA-37 Waveform ────────────────────────────────── */
        #waveform-wrap {
            width: 100%;
            max-width: 700px;
            height: 50px;
            margin-bottom: 12px;
            border-radius: 12px;
            overflow: hidden;
            background: rgba(20,27,46,0.45);
            border: 1px solid rgba(120,180,255,0.18);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            transition: opacity 0.3s;
        }
        #waveform-wrap.active { opacity: 1; }
        #waveform { width: 100%; height: 100%; display: block; }

        /* ── Vision: face/hand perception panel ───────────────── */
        #vision-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }
        #vision-btn {
            padding: 8px 16px;
            border: 2px solid var(--accent);
            border-radius: 999px;
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.95em;
        }
        #vision-btn.active { background: var(--accent); color: #000; }
        #track-toggle {
            display: none;            /* shown only while watching */
            align-items: center;
            gap: 6px;
            font-size: 0.85em;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }
        #track-toggle.show { display: inline-flex; }
        #track-toggle input { accent-color: var(--accent); cursor: pointer; }
        .vision-status {
            font-size: 0.85em;
            opacity: 0.75;
            min-height: 1.2em;
            text-align: center;
        }
        /* video + box-overlay share one positioned stage so boxes line up */
        #vision-stage {
            position: relative;
            width: 220px;
            max-width: 70%;
            display: none;
        }
        #vision-stage.live { display: block; }
        #vision-video {
            width: 100%;
            border-radius: 10px;
            display: block;
            transform: scaleX(-1); /* mirror like a selfie */
        }
        #vision-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            transform: scaleX(-1); /* match the mirrored video */
        }

        /* ── Proactive alert toast ─────────────────────────── */
        #alert-toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: var(--panel);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 24px;
            font-size: 0.9em;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 1000;
            max-width: 80%;
            text-align: center;
        }
        #alert-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ── PA-38 + PA-69: conversation log ───────────────── */
        .log-header {
            width: 100%;
            max-width: 700px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .log-header .log-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
        }
        .log-header button {
            font-size: 11px;
            color: var(--muted);
            background: none;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 3px 10px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
        }
        .log-header button:hover { color: var(--text); border-color: var(--muted); }

        #log {
            width: 100%;
            max-width: 700px;
            background: rgba(20,27,46,0.42);
            border: 1px solid rgba(120,180,255,0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 16px;
            /* PA-69: flex-grow fills remaining viewport on all screen sizes */
            flex: 1;
            min-height: 160px;
            overflow-y: auto;
            font-size: var(--font-base);
            line-height: 1.6;
            scroll-behavior: smooth;
        }
        /* PA-69: cap height on large desktop screens */
        @media (min-height: 700px) and (min-width: 600px) {
            #log { max-height: 420px; }
        }

        #log::-webkit-scrollbar { width: 6px; }
        #log::-webkit-scrollbar-track { background: transparent; }
        #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        .turn {
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #1e2840;
        }
        .turn:last-child { border-bottom: none; margin-bottom: 0; }
        .turn-meta {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }
        .turn .role {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted);
        }
        .turn .ts { font-size: 10px; color: #3d4a66; }
        .turn.user      .role { color: var(--accent); }
        .turn.assistant .role { color: var(--ok); }
        .turn.error     .role,
        .turn.error  .content { color: var(--accent-hot); }
        .turn .content { white-space: pre-wrap; }
        .turn-image {
            margin-top: 6px;
            max-width: 100%;
            border-radius: 10px;
            border: 1px solid rgba(120,180,255,0.25);
            box-shadow: 0 0 18px rgba(74,158,255,0.18);
            display: block;
        }

        .empty-hint {
            color: var(--muted);
            font-size: 13px;
            text-align: center;
            margin-top: 120px;
        }

        /* PA-69: tighten spacing on small phones */
        @media (max-width: 400px) {
            body { padding: 14px 12px 10px; }
            #status-bar { margin-bottom: 14px; }
            #waveform-wrap { height: 40px; margin-bottom: 10px; }
            .log-header { margin-bottom: 6px; }
        }
    </style>
</head>
<body>

    <!-- Full-screen living backdrop: bokeh depth orbs + flowing light streams -->
    <canvas id="bg-canvas" aria-hidden="true"></canvas>

    <div class="header">
        <!-- PA-82: first-run setup wizard -->
        <a id="setup-link" href="/setup" title="Setup &amp; diagnostics" aria-label="Setup and diagnostics">⚙ Setup</a>
        <h1>PLASMA</h1>
        <!-- PA-71: high-contrast toggle -->
        <button id="theme-btn" title="Toggle high-contrast mode" aria-label="Toggle high-contrast mode">◐</button>
    </div>
    <div class="subtitle">local-first voice assistant</div>

    <!-- JARVIS avatar — a neural network swimming in a galaxy. Nodes orbit,
         connections shift, colors flow, and it pulses live with the TTS voice. -->
    <div id="avatar-wrap">
        <canvas id="avatar" width="150" height="150" aria-hidden="true"></canvas>
    </div>

    <!-- PA-39: status indicator -->
    <div id="status-bar" class="">
        <span class="dot"></span>
        <span class="label">idle</span>
    </div>

    <button id="talk-btn">Hold to talk</button>
    <!-- PA-70: hint hidden in touch mode -->
    <div class="hint">or hold <b>SPACE</b></div>

    <!-- PA-37: waveform canvas -->
    <div id="waveform-wrap">
        <canvas id="waveform"></canvas>
    </div>

    <!-- Vision: face expression + hand gestures + object tracking (browser-driven) -->
    <div id="vision-panel">
        <button id="vision-btn" title="Let Plasma watch you through the camera">👁 Watch me</button>
        <label id="track-toggle" title="Detect &amp; track objects in real time, drawing boxes on the feed">
            <input type="checkbox" id="track-check"> 🎯 Track objects
        </label>
        <div id="vision-status" class="vision-status">vision off</div>
        <div id="vision-stage">
            <video id="vision-video" autoplay playsinline muted></video>
            <canvas id="vision-overlay"></canvas>
        </div>
    </div>

    <!-- Proactive alert toast (shown when Plasma speaks proactively) -->
    <div id="alert-toast"></div>

    <!-- PA-38: conversation history -->
    <div class="log-header">
        <span class="log-title">Conversation</span>
        <button id="clear-btn">Clear</button>
    </div>
    <div id="log">
        <div class="empty-hint" id="empty-hint">Say something to start…</div>
    </div>

<script>
const btn       = document.getElementById('talk-btn');
const statusBar = document.getElementById('status-bar');
const logEl     = document.getElementById('log');
const clearBtn  = document.getElementById('clear-btn');
const wrapEl    = document.getElementById('waveform-wrap');
const canvas    = document.getElementById('waveform');
const ctx2d     = canvas.getContext('2d');
const themeBtn  = document.getElementById('theme-btn');

let mediaRecorder = null;
let micStream     = null;
let chunks        = [];
let isRecording   = false;
let isBusy        = false;

// Persist session ID so analytics page can read it
let SESSION_ID = localStorage.getItem('plasma_session_id');
if (!SESSION_ID) {
    SESSION_ID = 'web-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('plasma_session_id', SESSION_ID);
}

// ── PA-71: high-contrast theme ────────────────────────────
(function initTheme() {
    if (localStorage.getItem('plasma-hc') === '1') document.documentElement.classList.add('hc');
})();

themeBtn.addEventListener('click', () => {
    const on = document.documentElement.classList.toggle('hc');
    localStorage.setItem('plasma-hc', on ? '1' : '0');
});

// ── PA-70: touch / keyboard-free detection ─────────────────
// coarse pointer = touchscreen; no hover = no physical mouse
const isTouchPrimary = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
if (isTouchPrimary) {
    document.body.classList.add('touch-mode');
    btn.textContent = 'Tap to talk';
}

// ── PA-39: status ─────────────────────────────────────────
// ── JARVIS avatar — 3D glass-node sphere with flowing light streams ───────
// Nodes sit on a rotating sphere (perspective-projected, depth-sorted), nearby
// ones link into a neural net, fibre-optic light ribbons flow through it, bokeh
// orbs drift behind, and the whole thing pulses live with the TTS voice
// (avatarLevel is fed by the lip-sync analyser).
const avatarCanvas = document.getElementById('avatar');
let avatarState = 'idle';   // idle | listening | thinking | speaking
let avatarLevel = 0;        // live audio amplitude 0..1 → drives the pulse
const TAU = Math.PI * 2;

(function initAvatar() {
    const cv = avatarCanvas, ctx = cv.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const CSS = 190;
    cv.width = CSS * DPR; cv.height = CSS * DPR;
    ctx.scale(DPR, DPR);
    const cx = CSS / 2, cy = CSS / 2, R = CSS * 0.30, FOCAL = 260;

    // Per-state look: core hue, colour spread, spin speed, aura rgb.
    const PALETTE = {
        idle:      { h: 205, spread: 90,  speed: 0.30, glow: '120,180,255' },
        listening: { h: 330, spread: 70,  speed: 0.85, glow: '255,90,150'  },
        thinking:  { h: 160, spread: 80,  speed: 0.55, glow: '80,230,180'  },
        speaking:  { h: 195, spread: 160, speed: 0.70, glow: '120,220,255' },
    };

    // Fibonacci sphere → even 3D node distribution.
    const N = reduce ? 22 : 42;
    const nodes = [];
    for (let i = 0; i < N; i++) {
        const y = 1 - (i / (N - 1)) * 2;
        const rad = Math.sqrt(Math.max(0, 1 - y * y));
        const theta = i * 2.39996;
        nodes.push({ x: Math.cos(theta) * rad, y, z: Math.sin(theta) * rad,
                     size: 1.7 + Math.random() * 1.8 });
    }
    // Fixed topology: link each node to its 3 nearest neighbours (dedup).
    const seen = new Set(), L = [];
    for (let i = 0; i < N; i++) {
        const ds = [];
        for (let j = 0; j < N; j++) if (j !== i) {
            const dx = nodes[i].x-nodes[j].x, dy = nodes[i].y-nodes[j].y, dz = nodes[i].z-nodes[j].z;
            ds.push([dx*dx+dy*dy+dz*dz, j]);
        }
        ds.sort((a, b) => a[0]-b[0]);
        for (let k = 0; k < 3; k++) {
            const j = ds[k][1], a = Math.min(i, j), b = Math.max(i, j), key = a+'_'+b;
            if (!seen.has(key)) { seen.add(key); L.push([a, b]); }
        }
    }
    // Fibre-optic light ribbons crossing the sphere.
    const STREAMS = [
        { hue: 190, y: -0.55, amp: 0.55, phase: 0.0, speed: 0.55 },
        { hue: 320, y:  0.10, amp: 0.62, phase: 2.1, speed: 0.45 },
        { hue: 35,  y:  0.60, amp: 0.50, phase: 4.0, speed: 0.65 },
        { hue: 265, y: -0.10, amp: 0.45, phase: 1.0, speed: 0.40 },
    ];
    // Bokeh depth orbs.
    const bokeh = [];
    for (let i = 0; i < (reduce ? 4 : 9); i++)
        bokeh.push({ a: Math.random()*TAU, r: R*(1.45+Math.random()*0.9),
            sz: 7+Math.random()*15, hue: [190,320,35,265][i%4],
            sp: (Math.random()*0.3+0.08)*(Math.random()<0.5?-1:1), bob: Math.random()*TAU });

    function drawStream(s, lvl, t) {
        const ph = t*s.speed + s.phase, baseY = cy + s.y*R, amp = s.amp*R*(0.8+lvl*0.5), steps = 26;
        ctx.lineWidth = 2.2 + lvl*2.8; ctx.lineCap = 'round';
        for (let i = 0; i < steps; i++) {
            const u0 = i/steps, u1 = (i+1)/steps;
            const env0 = Math.sin(u0*Math.PI), env1 = Math.sin(u1*Math.PI);
            const x0 = -12+u0*(CSS+24), x1 = -12+u1*(CSS+24);
            const y0 = baseY + Math.sin(u0*6+ph)*amp*env0, y1 = baseY + Math.sin(u1*6+ph)*amp*env1;
            const head = ((u0 - (t*s.speed*0.5))%1+1)%1;
            const bright = Math.pow(1 - Math.abs(((head+0.5)%1)-0.5)*2, 2);
            const o = (0.07+bright*0.55)*(0.6+lvl*0.6)*env0;
            ctx.strokeStyle = `hsla(${s.hue},95%,${60+bright*25}%,${o})`;
            ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
        }
    }

    let t = 0, last = performance.now();
    let curHue = PALETTE.idle.h, curSpread = PALETTE.idle.spread, curSpeed = PALETTE.idle.speed;

    function frame(now) {
        const dt = Math.min(0.05, (now-last)/1000); last = now; t += dt;
        const p = PALETTE[avatarState] || PALETTE.idle;
        curHue    += (p.h - curHue) * 0.06;
        curSpread += (p.spread - curSpread) * 0.06;
        curSpeed  += (p.speed - curSpeed) * 0.06;
        avatarLevel *= 0.86;
        const lvl = avatarLevel;
        const ry = t*curSpeed*(1+lvl*1.2), rx = Math.sin(t*0.3)*0.35;
        const cosY = Math.cos(ry), sinY = Math.sin(ry), cosX = Math.cos(rx), sinX = Math.sin(rx);
        const pulse = (1 + lvl*0.22 + Math.sin(t*1.2)*0.02) * R;

        ctx.clearRect(0, 0, CSS, CSS);
        ctx.globalCompositeOperation = 'lighter';

        // bokeh depth orbs
        for (const b of bokeh) {
            b.a += b.sp*dt;
            const bx = cx+Math.cos(b.a)*b.r, by = cy+Math.sin(b.a)*b.r*0.7+Math.sin(t+b.bob)*4;
            const g = ctx.createRadialGradient(bx,by,0,bx,by,b.sz);
            g.addColorStop(0, `hsla(${b.hue},90%,65%,${0.10+lvl*0.10})`);
            g.addColorStop(1, `hsla(${b.hue},90%,55%,0)`);
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(bx,by,b.sz,0,TAU); ctx.fill();
        }

        // project nodes (rotate Y then X, perspective)
        const pts = [];
        for (const nd of nodes) {
            let x = nd.x*cosY - nd.z*sinY;
            let z = nd.x*sinY + nd.z*cosY;
            let y = nd.y*cosX - z*sinX;
            z = nd.y*sinX + z*cosX;
            const scale = FOCAL/(FOCAL - z*pulse);
            pts.push({ sx: cx+x*pulse*scale, sy: cy+y*pulse*scale, depth: (z+1)/2, scale, nd });
        }

        // flowing light streams
        for (const s of STREAMS) drawStream(s, lvl, t);

        // neural-net connections (depth-shaded)
        ctx.lineWidth = 1;
        for (const [a, b] of L) {
            const pa = pts[a], pb = pts[b], dep = (pa.depth+pb.depth)/2;
            const hue = curHue + dep*curSpread + t*16;
            ctx.strokeStyle = `hsla(${hue},85%,${55+lvl*15}%,${(0.08+dep*0.42)*(0.7+lvl*0.6)})`;
            ctx.beginPath(); ctx.moveTo(pa.sx,pa.sy); ctx.lineTo(pb.sx,pb.sy); ctx.stroke();
        }

        // glassy nodes, back-to-front
        pts.sort((a, b) => a.depth - b.depth);
        for (const pt of pts) {
            const hue = curHue + pt.depth*curSpread + t*22;
            const sz = pt.nd.size*pt.scale*(0.7+pt.depth*0.6)*(1+lvl*0.6);
            const alpha = 0.35 + pt.depth*0.6;
            const g = ctx.createRadialGradient(pt.sx,pt.sy,0,pt.sx,pt.sy,sz*3.4);
            g.addColorStop(0, `hsla(${hue},95%,68%,${alpha})`);
            g.addColorStop(1, `hsla(${hue},95%,60%,0)`);
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(pt.sx,pt.sy,sz*3.4,0,TAU); ctx.fill();
            const gb = ctx.createRadialGradient(pt.sx-sz*0.4,pt.sy-sz*0.5,sz*0.1,pt.sx,pt.sy,sz);
            gb.addColorStop(0, `hsla(${hue},100%,92%,${alpha})`);
            gb.addColorStop(0.5, `hsla(${hue},95%,65%,${alpha*0.9})`);
            gb.addColorStop(1, `hsla(${hue+20},90%,45%,${alpha*0.7})`);
            ctx.fillStyle = gb; ctx.beginPath(); ctx.arc(pt.sx,pt.sy,sz,0,TAU); ctx.fill();
            ctx.fillStyle = `hsla(0,0%,100%,${alpha*0.8})`;
            ctx.beginPath(); ctx.arc(pt.sx-sz*0.35,pt.sy-sz*0.4,sz*0.28,0,TAU); ctx.fill();
        }

        ctx.globalCompositeOperation = 'source-over';
        cv.style.filter = `drop-shadow(0 0 ${14+lvl*30}px rgba(${p.glow},${0.25+lvl*0.4}))`;
        requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
})();

// ── Living backdrop — bokeh depth orbs + flowing light streams ────────────
(function initBackdrop() {
    const cv = document.getElementById('bg-canvas');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W = 0, H = 0, DPR = 1, bokeh = [], streams = [];

    function build() {
        const n = reduce ? 8 : Math.min(24, Math.round(W*H/48000));
        bokeh = [];
        for (let i = 0; i < n; i++)
            bokeh.push({ x: Math.random()*W, y: Math.random()*H, r: 24+Math.random()*80,
                hue: [200,320,35,265,160][i%5], sp: 0.02+Math.random()*0.14,
                drift: Math.random()*TAU, o: 0.05+Math.random()*0.07 });
        streams = [
            { hue: 195, y: 0.22, amp: 55, phase: 0, speed: 0.10, w: 1.6 },
            { hue: 320, y: 0.52, amp: 75, phase: 2, speed: 0.08, w: 1.8 },
            { hue: 35,  y: 0.80, amp: 60, phase: 4, speed: 0.12, w: 1.5 },
        ];
    }
    function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
        build();
    }

    let t = 0, last = performance.now();
    function frame(now) {
        const dt = Math.min(0.05, (now-last)/1000); last = now; t += dt;
        ctx.clearRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';
        for (const b of bokeh) {
            b.y -= b.sp; b.x += Math.sin(t*0.2+b.drift)*0.15;
            if (b.y < -b.r) { b.y = H+b.r; b.x = Math.random()*W; }
            const g = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
            g.addColorStop(0, `hsla(${b.hue},80%,60%,${b.o})`);
            g.addColorStop(1, `hsla(${b.hue},80%,55%,0)`);
            ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();
        }
        for (const s of streams) {
            const ph = t*s.speed*6+s.phase, baseY = H*s.y, steps = 44;
            ctx.lineWidth = s.w; ctx.lineCap = 'round';
            for (let i = 0; i < steps; i++) {
                const u0 = i/steps, u1 = (i+1)/steps;
                const y0 = baseY+Math.sin(u0*5+ph)*s.amp+Math.sin(u0*13+ph*1.7)*s.amp*0.3;
                const y1 = baseY+Math.sin(u1*5+ph)*s.amp+Math.sin(u1*13+ph*1.7)*s.amp*0.3;
                const head = ((u0-(t*s.speed))%1+1)%1;
                const bright = Math.pow(1-Math.abs(((head+0.5)%1)-0.5)*2, 3);
                ctx.strokeStyle = `hsla(${s.hue},90%,${55+bright*30}%,${0.04+bright*0.18})`;
                ctx.beginPath(); ctx.moveTo(u0*W,y0); ctx.lineTo(u1*W,y1); ctx.stroke();
            }
        }
        ctx.globalCompositeOperation = 'source-over';
        requestAnimationFrame(frame);
    }
    window.addEventListener('resize', resize);
    resize();
    requestAnimationFrame(frame);
})();

function setStatus(state) {
    const map = {
        idle:      { cls: 'idle',      label: 'idle' },
        listening: { cls: 'listening', label: 'listening…' },
        thinking:  { cls: 'thinking',  label: 'thinking…' },
        speaking:  { cls: 'speaking',  label: 'speaking…' },
        error:     { cls: '',          label: 'error' },
    };
    const s = map[state] || map.idle;
    statusBar.className = s.cls;
    statusBar.querySelector('.label').textContent = s.label;
    // Galaxy mirrors the status (error falls back to a calm idle swirl).
    avatarState = (state === 'error') ? 'idle' : state;
}

// ── PA-37: waveform ───────────────────────────────────────
let audioCtx = null;
let analyser = null;
let rafId    = null;

function initAnalyser(stream) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
}

function drawWaveform() {
    const W = canvas.width  = wrapEl.clientWidth;
    const H = canvas.height = wrapEl.clientHeight;
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteTimeDomainData(data);
    ctx2d.clearRect(0, 0, W, H);
    ctx2d.lineWidth   = 2;
    ctx2d.strokeStyle = getComputedStyle(document.documentElement)
                            .getPropertyValue('--accent-hot').trim();
    ctx2d.beginPath();
    const step = W / data.length;
    let x = 0;
    for (let i = 0; i < data.length; i++) {
        const y = (data[i] / 128.0) * (H / 2);
        i === 0 ? ctx2d.moveTo(x, y) : ctx2d.lineTo(x, y);
        x += step;
    }
    ctx2d.stroke();
    rafId = requestAnimationFrame(drawWaveform);
}

function startWaveform() {
    wrapEl.classList.add('active');
    if (analyser) rafId = requestAnimationFrame(drawWaveform);
}

function stopWaveform() {
    wrapEl.classList.remove('active');
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    ctx2d.clearRect(0, 0, canvas.width, canvas.height);
}

// ── PA-38: conversation log ───────────────────────────────
function nowStr() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function addTurn(role, content) {
    document.getElementById('empty-hint')?.remove();
    const div = document.createElement('div');
    div.className = 'turn ' + role;
    div.innerHTML =
        `<div class="turn-meta">` +
            `<span class="role">${role}</span>` +
            `<span class="ts">${nowStr()}</span>` +
        `</div>` +
        `<div class="content"></div>`;
    div.querySelector('.content').textContent = content;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
}

// Render an annotated camera frame (e.g. "find my X" with a box drawn on it).
function addImageTurn(b64) {
    document.getElementById('empty-hint')?.remove();
    const div = document.createElement('div');
    div.className = 'turn assistant';
    div.innerHTML =
        `<div class="turn-meta">` +
            `<span class="role">assistant</span>` +
            `<span class="ts">${nowStr()}</span>` +
        `</div>`;
    const img = document.createElement('img');
    img.className = 'turn-image';
    img.src = 'data:image/jpeg;base64,' + b64;
    img.alt = 'annotated camera view';
    div.appendChild(img);
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
}

clearBtn.addEventListener('click', () => {
    logEl.innerHTML = '<div class="empty-hint" id="empty-hint">Say something to start…</div>';
});

// ── mic + recording ───────────────────────────────────────
async function initMic() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        const isLocalhost = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
        const msg = isLocalhost
            ? 'Microphone API unavailable. Try a different browser.'
            : `Microphone requires a secure context.\nOpen via http://localhost:8000 on this PC,\nor use HTTPS for remote access.`;
        setStatus('error');
        addTurn('error', msg);
        return false;
    }
    try {
        micStream     = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(micStream, { mimeType: 'audio/webm' });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        mediaRecorder.onstop = async () => {
            const blob = new Blob(chunks, { type: 'audio/webm' });
            chunks = [];
            await sendAudio(blob);
        };
        initAnalyser(micStream);
        setStatus('idle');
        return true;
    } catch (err) {
        setStatus('error');
        addTurn('error', 'Microphone access denied: ' + err.message);
        return false;
    }
}

// Lip-sync: route playback audio through a Web Audio analyser and drive the
// avatar mouth's vertical scale from the live amplitude. Falls back silently
// to plain playback if Web Audio isn't available.
let speakRaf = null;

function startLipSync(audioEl) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const src = audioCtx.createMediaElementSource(audioEl);
        const lipAnalyser = audioCtx.createAnalyser();
        lipAnalyser.fftSize = 256;
        src.connect(lipAnalyser);
        lipAnalyser.connect(audioCtx.destination);
        const buf = new Uint8Array(lipAnalyser.frequencyBinCount);
        const tick = () => {
            lipAnalyser.getByteFrequencyData(buf);
            let sum = 0;
            for (let i = 0; i < buf.length; i++) sum += buf[i];
            const level = sum / buf.length / 255;           // 0..1 average energy
            avatarLevel = Math.min(1, level * 5);           // drives the galaxy pulse
            speakRaf = requestAnimationFrame(tick);
        };
        tick();
    } catch (e) {
        // createMediaElementSource can throw if the element was already routed;
        // just skip lip-sync, audio still plays via the element itself.
        console.debug('[lipsync] disabled:', e.message);
    }
}

function stopLipSync() {
    if (speakRaf) { cancelAnimationFrame(speakRaf); speakRaf = null; }
    avatarLevel = 0;
}

function playBase64Audio(b64) {
    return new Promise((resolve) => {
        if (!b64) { resolve(); return; }
        const finish = () => { stopLipSync(); resolve(); };
        try {
            const audio = new Audio('data:audio/wav;base64,' + b64);
            audio.crossOrigin = 'anonymous';
            audio.onended = finish;
            audio.onerror = () => {
                addTurn('error', 'Audio playback failed (browser blocked autoplay?)');
                finish();
            };
            audio.play().then(() => startLipSync(audio)).catch(() => {
                addTurn('error', 'Audio autoplay blocked — tap the page once, then retry.');
                finish();
            });
        } catch (e) { console.error(e); finish(); }
    });
}

async function sendAudio(blob) {
    if (isBusy) return;
    isBusy = true;
    setStatus('thinking');
    const form = new FormData();
    form.append('audio', blob, 'speech.webm');
    form.append('session_id', SESSION_ID);
    try {
        const r    = await fetch('/voice/chat', { method: 'POST', body: form });
        const data = await r.json();
        if (data.transcript) addTurn('user', data.transcript);
        if (data.reply)      addTurn('assistant', data.reply);
        if (data.image_b64)  addImageTurn(data.image_b64);
        if (data.error && !data.transcript) addTurn('error', data.error);
        if (data.audio_b64) {
            setStatus('speaking');
            await playBase64Audio(data.audio_b64);
        }
        setStatus('idle');
    } catch (err) {
        setStatus('error');
        addTurn('error', 'Request failed: ' + err.message);
    } finally {
        isBusy = false;
    }
}

function startRecording() {
    if (isRecording || isBusy || !mediaRecorder) return;
    if (mediaRecorder.state === 'recording') return;
    isRecording = true;
    btn.classList.add('recording');
    btn.textContent = isTouchPrimary ? 'Tap to stop' : 'Listening…';
    setStatus('listening');
    startWaveform();
    chunks = [];
    mediaRecorder.start();
}

function stopRecording() {
    if (!isRecording || !mediaRecorder) return;
    isRecording = false;
    btn.classList.remove('recording');
    btn.textContent = isTouchPrimary ? 'Tap to talk' : 'Hold to talk';
    stopWaveform();
    if (mediaRecorder.state === 'recording') mediaRecorder.stop();
}

// ── PA-70: input handling — hold on desktop, tap-toggle on touch ───
if (isTouchPrimary) {
    // Tap to start, tap again to stop (pure voice, no hold required)
    btn.addEventListener('click', () => {
        if (isRecording) stopRecording();
        else startRecording();
    });
} else {
    // Desktop: hold-to-talk
    btn.addEventListener('mousedown',  startRecording);
    btn.addEventListener('mouseup',    stopRecording);
    btn.addEventListener('mouseleave', stopRecording);
    btn.addEventListener('touchstart', e => { e.preventDefault(); startRecording(); });
    btn.addEventListener('touchend',   e => { e.preventDefault(); stopRecording(); });
}

// Keyboard SPACE (desktop)
window.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault(); startRecording();
    }
});
window.addEventListener('keyup', e => {
    if (e.code === 'Space') { e.preventDefault(); stopRecording(); }
});

initMic();

// ── PA-34: wake word WebSocket ────────────────────────────
const WAKE_AUTO_STOP_MS = 6000;
let wakeStopTimer = null;

function connectWakeSocket() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws/wake`);

    ws.onopen = () => console.log('[wake] WebSocket connected');

    ws.onmessage = (ev) => {
        try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'wake' && !isRecording && !isBusy) {
                console.log(`[wake] detected (score=${msg.score?.toFixed(2)})`);
                startRecording();
                clearTimeout(wakeStopTimer);
                wakeStopTimer = setTimeout(() => { if (isRecording) stopRecording(); }, WAKE_AUTO_STOP_MS);
            }
        } catch (e) { console.warn('[wake] bad message', ev.data); }
    };

    ws.onclose = () => {
        console.log('[wake] WebSocket closed — reconnecting in 3s');
        setTimeout(connectWakeSocket, 3000);
    };

    ws.onerror = e => console.warn('[wake] WebSocket error', e);
}

connectWakeSocket();

// ── Proactive alerts (/ws/alerts → spoken + toast) ────────────
const alertToast = document.getElementById('alert-toast');
let alertToastTimer = null;

function showAlertToast(text) {
    alertToast.textContent = text;
    alertToast.classList.add('show');
    clearTimeout(alertToastTimer);
    alertToastTimer = setTimeout(() => alertToast.classList.remove('show'), 5000);
}

function connectAlertSocket() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}/ws/alerts`);
    ws.onmessage = async (ev) => {
        try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'alert') {
                if (msg.text) showAlertToast(msg.text);
                if (msg.audio_b64 && !isBusy && !isRecording) {
                    // Proactive speech: light up the galaxy, then settle back.
                    avatarState = 'speaking';
                    await playBase64Audio(msg.audio_b64);
                    avatarState = 'idle';
                }
            }
        } catch (e) { console.warn('[alerts] bad message', ev.data); }
    };
    ws.onclose = () => setTimeout(connectAlertSocket, 3000);
    ws.onerror = e => console.warn('[alerts] WS error', e);
}
connectAlertSocket();

// ── Vision: browser-driven face/hand perception ───────────────
// The button owns the camera (works on PC and phone). Frames stream to the
// server at a low FPS; perception runs server-side. Toggling off stops the
// camera and the socket, so there's zero cost when not watching.
const visionBtn     = document.getElementById('vision-btn');
const visionStatus  = document.getElementById('vision-status');
const visionVideo   = document.getElementById('vision-video');
const visionStage   = document.getElementById('vision-stage');
const visionOverlay = document.getElementById('vision-overlay');
const trackToggle   = document.getElementById('track-toggle');
const trackCheck    = document.getElementById('track-check');
let visionOn = false;
let visionStream = null;
let visionWS = null;
let visionTimer = null;
let visionCanvas = null;
const VISION_FPS = 6;

// Persistent colour per track id so a tracked object keeps its box colour.
const trackColors = {};
function colorFor(id) {
    if (!trackColors[id]) {
        const hue = (id * 67) % 360;          // spread ids around the wheel
        trackColors[id] = `hsl(${hue}, 90%, 60%)`;
    }
    return trackColors[id];
}

// ── Smooth, no-blink box rendering ────────────────────────────────────────
// The server sends tracks at ~5 fps (and coasts over missed frames). The client
// keeps a *target* box per id and glides the *displayed* box toward it every
// animation frame (~60 fps), so boxes follow moving objects smoothly instead of
// jumping or blinking. Targets expire after a short grace period when an object
// truly leaves.
let trackTargets = {};      // id → {box:[x,y,w,h], label, direction, ts}
let trackDisplay = {};      // id → {box:[x,y,w,h]} (interpolated)
let trackFrameW = 0, trackFrameH = 0;
let trackRaf = null;
const TRACK_EXPIRE_MS = 700; // hide a box this long after its last update
const ARROWS = { left:'←', right:'→', up:'↑', down:'↓' };

function updateTrackTargets(objects, fw, fh) {
    trackFrameW = fw || trackFrameW;
    trackFrameH = fh || trackFrameH;
    const now = performance.now();
    for (const o of (objects || [])) {
        trackTargets[o.id] = {
            box: o.box.slice(), label: o.label, direction: o.direction, ts: now,
        };
    }
    if (!trackRaf) trackRaf = requestAnimationFrame(boxFrame);
}

function drawOneBox(ctx, id, box, label, direction, sx, sy) {
    const [x, y, w, h] = box;
    const c = colorFor(id);
    ctx.lineWidth = 2;
    ctx.strokeStyle = c;
    ctx.shadowColor = c; ctx.shadowBlur = 8;
    ctx.strokeRect(x * sx, y * sy, w * sx, h * sy);
    ctx.shadowBlur = 0;
    // The overlay is CSS-mirrored, so flip text back to read correctly.
    const arrow = direction ? (ARROWS[direction] || '') : '';
    const text = `${label} #${id} ${arrow}`.trim();
    ctx.save();
    ctx.scale(-1, 1);
    ctx.font = '600 13px -apple-system, Segoe UI, sans-serif';
    ctx.textBaseline = 'bottom';
    const tx = -(x * sx + w * sx);
    const ty = Math.max(13, y * sy - 3);
    ctx.fillStyle = c;
    const tw = ctx.measureText(text).width + 8;
    ctx.fillRect(tx, ty - 15, tw, 16);
    ctx.fillStyle = '#000';
    ctx.fillText(text, tx + 4, ty);
    ctx.restore();
}

function boxFrame() {
    const ctx = visionOverlay.getContext('2d');
    const dw = visionVideo.clientWidth, dh = visionVideo.clientHeight;
    if (visionOverlay.width !== dw || visionOverlay.height !== dh) {
        visionOverlay.width = dw; visionOverlay.height = dh;
    }
    ctx.clearRect(0, 0, dw, dh);
    const now = performance.now();
    const sx = dw / (trackFrameW || dw), sy = dh / (trackFrameH || dh);
    for (const id of Object.keys(trackTargets)) {
        const tgt = trackTargets[id];
        if (now - tgt.ts > TRACK_EXPIRE_MS) {        // object gone → drop it
            delete trackTargets[id]; delete trackDisplay[id];
            continue;
        }
        let disp = trackDisplay[id];
        if (!disp) { disp = { box: tgt.box.slice() }; trackDisplay[id] = disp; }
        for (let i = 0; i < 4; i++) disp.box[i] += (tgt.box[i] - disp.box[i]) * 0.3;
        drawOneBox(ctx, id, disp.box, tgt.label, tgt.direction, sx, sy);
    }
    if (visionOn && trackCheck.checked) {
        trackRaf = requestAnimationFrame(boxFrame);
    } else {
        trackRaf = null;
        ctx.clearRect(0, 0, dw, dh);
    }
}

function clearBoxes() {
    trackTargets = {}; trackDisplay = {};
    if (trackRaf) { cancelAnimationFrame(trackRaf); trackRaf = null; }
    const ctx = visionOverlay.getContext('2d');
    ctx.clearRect(0, 0, visionOverlay.width, visionOverlay.height);
}

async function startVision() {
    try {
        visionStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    } catch (e) {
        visionStatus.textContent = 'camera blocked';
        console.warn('[vision] getUserMedia failed', e);
        return;
    }
    visionVideo.srcObject = visionStream;
    visionStage.classList.add('live');
    trackToggle.classList.add('show');
    visionCanvas = document.createElement('canvas');

    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    visionWS = new WebSocket(`${proto}://${location.host}/ws/perception-input`);

    visionWS.onopen = () => {
        visionStatus.textContent = 'watching…';
        visionTimer = setInterval(sendVisionFrame, Math.round(1000 / VISION_FPS));
    };
    visionWS.onmessage = (ev) => {
        try {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'perception') {
                const who = msg.identity ? `${msg.identity}: ` : '';
                let line = who + (msg.summary || '…');
                if (trackCheck.checked && msg.objects && msg.objects.length) {
                    const names = msg.objects.map(o => `${o.label} #${o.id}`).join(', ');
                    line += ` · 🎯 ${names}`;
                }
                visionStatus.textContent = line;
                if (trackCheck.checked) updateTrackTargets(msg.objects, msg.frame_w, msg.frame_h);
            } else if (msg.type === 'error') {
                visionStatus.textContent = '⚠ ' + msg.message;
            }
        } catch (e) { /* ignore */ }
    };
    visionWS.onclose = () => { if (visionOn) visionStatus.textContent = 'reconnecting…'; };
    visionWS.onerror = e => console.warn('[vision] WS error', e);
}

function sendVisionFrame() {
    if (!visionWS || visionWS.readyState !== WebSocket.OPEN) return;
    if (!visionVideo.videoWidth) return;
    visionCanvas.width = visionVideo.videoWidth;
    visionCanvas.height = visionVideo.videoHeight;
    visionCanvas.getContext('2d').drawImage(visionVideo, 0, 0);
    const b64 = visionCanvas.toDataURL('image/jpeg', 0.7).split(',')[1];
    visionWS.send(JSON.stringify({
        frame: b64, language: 'en', identify: true, track: trackCheck.checked,
    }));
}

function stopVision() {
    clearInterval(visionTimer); visionTimer = null;
    if (visionWS) { try { visionWS.close(); } catch (e) {} visionWS = null; }
    if (visionStream) { visionStream.getTracks().forEach(t => t.stop()); visionStream = null; }
    visionVideo.srcObject = null;
    visionStage.classList.remove('live');
    trackToggle.classList.remove('show');
    clearBoxes();
    visionStatus.textContent = 'vision off';
}

// Clear boxes immediately when tracking is switched off mid-stream.
trackCheck.addEventListener('change', () => {
    if (!trackCheck.checked) clearBoxes();
});

visionBtn.addEventListener('click', () => {
    visionOn = !visionOn;
    visionBtn.classList.toggle('active', visionOn);
    visionBtn.textContent = visionOn ? '👁 Stop watching' : '👁 Watch me';
    if (visionOn) startVision(); else stopVision();
});
</script>
</body>
</html>
